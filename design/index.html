<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World Acceptance 2</title>
  <style>
    :root {
      --background: #FFFFFF;
      --text: #000000;
      --primary: #2563EB;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 640px;
    }

    .greeting-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 88px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
      overflow-wrap: anywhere;
    }

    form {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input {
      width: min(100%, 380px);
      border: 1px solid var(--text);
      background: var(--background);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
    }

    button {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: var(--background);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 20px;
      cursor: pointer;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .message {
      min-height: 20px;
      margin: 0;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      form {
        flex-direction: column;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="greeting-section" aria-labelledby="greeting-heading">
      <h1 id="greeting-heading">Hello, World!</h1>
      <form id="greeting-form" novalidate>
        <label for="greeting-input">Greeting</label>
        <input id="greeting-input" name="greeting" type="text" value="Hello, World!" required aria-describedby="form-message">
        <button type="submit">Save</button>
      </form>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('greeting-form');
    const input = document.getElementById('greeting-input');
    const heading = document.getElementById('greeting-heading');
    const message = document.getElementById('form-message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const nextGreeting = input.value.trim();

      if (!nextGreeting) {
        message.textContent = 'Enter a greeting.';
        input.focus();
        return;
      }

      heading.textContent = nextGreeting;
      input.value = nextGreeting;
      message.textContent = 'Saved.';
    });
  </script>
</body>
</html>
